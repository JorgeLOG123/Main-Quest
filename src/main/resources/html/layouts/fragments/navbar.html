<nav id="nav" th:fragment="nav"
     xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
     class="navbar navbar-expand-lg mq-navbar py-3">
    <div class="container">
        <a class="mq-brand" th:href="@{/}">
            <div class="mq-brand-icon">MQ</div>
            <span class="mq-brand-text" th:text="#{navbar.brand}">Main Quest</span>
        </a>

        <div class="d-flex align-items-center gap-3 ms-auto">
            <!-- Status badge -->
            <span class="status-badge d-none d-md-inline-flex">
                <span class="status-dot"></span>
                <span th:text="#{navbar.status.connected}">Spring Boot :8080 Conectado</span>
            </span>

            <!-- Administración: administradores y árbitros -->
            <a sec:authorize="isAuthenticated() && hasAnyRole('ROLE_ADMINISTRADOR', 'ROLE_ARBITRO')"
               class="btn btn-outline-light btn-sm" th:href="@{/admin/dashboard}">
                <i class="fa-solid fa-gear"></i> <span th:text="#{navbar.admin}">Administración</span>
            </a>

            <!-- Solo se ve si NO hay nadie logueado -->
            <th:block sec:authorize="!isAuthenticated()">
                <a class="btn btn-outline-light btn-sm" th:href="@{/signin}">
                    <i class="fa-solid fa-right-to-bracket"></i> <span th:text="#{navbar.btn.login}">Ingresar</span>
                </a>
                <a class="btn btn-mq-primary btn-sm px-3" th:href="@{/registro}">
                    <i class="fa-solid fa-user-plus"></i> <span th:text="#{navbar.btn.register}">Registrarse</span>
                </a>
            </th:block>

            <!-- Solo se ve si HAY alguien logueado -->
            <a sec:authorize="isAuthenticated()" class="btn btn-outline-light btn-sm" th:href="@{/profile/view}">
                <i class="fa-solid fa-user"></i>
                <span th:text="#{navbar.btn.account}">Mi cuenta</span>
                <span class="text-white-50 ms-1">(<span sec:authentication="email"></span>)</span>
            </a>

            <!-- Cerrar sesión: solo si HAY alguien logueado -->
            <a sec:authorize="isAuthenticated()" class="btn btn-outline-light btn-sm" th:href="@{/logout}">
                <i class="fa-solid fa-right-from-bracket"></i> <span th:text="#{navbar.btn.logout}">Cerrar sesión</span>
            </a>

            <!-- Jugar: jugadores logueados (el administrador y el árbitro no juegan) -->
            <a sec:authorize="hasRole('ROLE_JUGADOR')" class="btn btn-mq-primary btn-sm px-3" th:href="@{/game}">
                <i class="fa-solid fa-play"></i> <span th:text="#{navbar.btn.play}">Jugar</span>
            </a>

            <!-- Jugar como invitado: nadie logueado -->
            <a sec:authorize="!isAuthenticated()" class="btn btn-mq-primary btn-sm px-3" th:href="@{/game/guest}">
                <i class="fa-solid fa-play"></i> <span th:text="#{navbar.btn.play.as.guest}">Jugar como invitado</span>
            </a>
        </div>
    </div>
</nav>
