<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title th:text="#{dashboard.title}">Main Quest — Administración</title>
</head>
<body>

<div layout:fragment="page-content">
    <h2 class="text-light my-4" th:text="#{dashboard.section.title}">Panel de Administración</h2>

    <div class="row g-4">

        <!-- JUGADORES -->
        <div class="col-md-6">
            <div class="glass-card p-4 text-center">
                <h3 class="text-warning fs-1" th:text="${cant_jugadores} ?: 0">0</h3>
                <p class="text-white-50 mb-0" th:text="#{dashboard.total.jugadores}">jugadores registrados</p>
                <a th:href="@{/admin/user/list}" class="btn btn-outline-light btn-sm mt-3"
                   th:text="#{dashboard.btn.list}">Ver listado</a>
            </div>
        </div>

        <!-- MISIONES -->
        <div class="col-md-6">
            <div class="glass-card p-4 text-center">
                <h3 class="text-warning fs-1" th:text="${cant_misiones} ?: 0">0</h3>
                <p class="text-white-50 mb-0" th:text="#{dashboard.total.misiones}">misiones creadas</p>
                <a th:href="@{/admin/mision/choose}" class="btn btn-outline-light btn-sm mt-3"
                   th:text="#{dashboard.btn.new.mision}">Nueva misión</a>
                <a th:href="@{/admin/mision/list}" class="btn btn-outline-light btn-sm mt-3"
                   th:text="#{dashboard.btn.list}">Ver listado</a>
            </div>
        </div>

    </div>
</div>

</body>
</html>
