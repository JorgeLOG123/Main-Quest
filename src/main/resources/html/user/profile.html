<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title th:text="#{profile.title}">Main Quest — Mi cuenta</title>
</head>
<body>

<div layout:fragment="page-content">
    <div class="row justify-content-center my-5">
        <div class="col-md-6">
            <div class="glass-card p-5 text-center">

                <h2 class="text-light mb-4" th:text="#{profile.section.title}">Mi cuenta</h2>

                <form th:object="${form}"
                      th:action="@{/profile/save}"
                      method="post"
                      enctype="multipart/form-data">

                    <!-- FOTO -->
                    <div class="position-relative d-inline-block mb-2">
                        <!-- Si TIENE foto: la pedimos a la ventanilla -->
                        <img th:if="${form.mostrarImagen()}"
                             th:src="@{/profile/picture/view(id=${form.idPicture})}"
                             alt="Foto de perfil"
                             class="rounded-circle border border-3 border-secondary"
                             style="width: 140px; height: 140px; object-fit: cover;"/>

                        <!-- Si NO tiene foto: el ícono de siempre -->
                        <div th:if="${!form.mostrarImagen()}"
                             class="rounded-circle border border-3 border-secondary d-flex align-items-center justify-content-center"
                             style="width: 140px; height: 140px; font-size: 64px;">
                            <i class="fa-solid fa-user text-white-50"></i>
                        </div>

                        <button type="button"
                                class="btn btn-mq-primary btn-sm rounded-circle position-absolute bottom-0 end-0"
                                onclick="document.getElementById('picture').click();">
                            <i class="fa-solid fa-pencil"></i>
                        </button>

                        <input id="picture" name="file" type="file" accept="image/*" class="d-none"
                               onchange="document.getElementById('picture-name').textContent = this.files.length ? this.files[0].name : '';"/>
                    </div>

                    <p id="picture-name" class="text-white-50 small mb-4"></p>

                    <!-- NOMBRE -->
                    <div class="mb-3 text-start">
                        <label for="nombre" class="form-label text-white-50" th:text="#{profile.label.nombre}">Nombre</label>
                        <input id="nombre" type="text" th:field="*{nombre}"
                               class="form-control bg-secondary bg-opacity-20 border-secondary text-light"/>
                    </div>

                    <!-- EMAIL (solo lectura) -->
                    <div class="mb-4 text-start">
                        <label for="email" class="form-label text-white-50" th:text="#{profile.label.email}">Email</label>
                        <input id="email" type="email" th:field="*{email}" readonly
                               class="form-control bg-secondary bg-opacity-20 border-secondary text-white-50"/>
                    </div>

                    <button type="submit" class="btn-mq-primary w-100 justify-content-center"
                            th:text="#{profile.btn.save}">Guardar</button>
                </form>

            </div>
        </div>
    </div>
</div>

</body>
</html>
